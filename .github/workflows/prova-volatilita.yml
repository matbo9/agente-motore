name: Prova volatilita' (TimesFM)
on:
  workflow_dispatch:
jobs:
  prova:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Scarica il codice dal repository privato
        uses: actions/checkout@v4
        with:
          repository: matbo9/agente-finanza
          token: ${{ secrets.PRIVATE_REPO_TOKEN }}
          path: codice
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install yfinance pandas numpy
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install "timesfm[torch] @ git+https://github.com/google-research/timesfm.git"
      - run: python prova_volatilita.py
        working-directory: codice
# FINE FILE prova-volatilita.yml
